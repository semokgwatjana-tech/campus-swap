{% extends "base.html" %}
{% block title %}Something Went Wrong{% endblock %}
{% block content %}
<div class="container my-5 text-center">
  <div class="neu-surface p-5 mx-auto" style="max-width:480px;">
    <i class="bi bi-exclamation-triangle" style="font-size:3rem;color:var(--cs-warning);" aria-hidden="true"></i>
    <h3 class="fw-bold mt-3">Something Went Wrong</h3>
    <p class="text-muted-navy">Our team has been notified. Please try again shortly.</p>
    <a href="{{ url_for('main.landing') }}" class="btn-neu-primary">Back to Home</a>
  </div>
</div>
{% endblock %}
