{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="container my-4">
  <h3 class="fw-bold mb-4"><i class="bi bi-bell" aria-hidden="true"></i> Notifications</h3>
  <div class="neu-surface p-2">
    {% for n in notifications %}
    <a href="{{ n.link or '#' }}" class="d-block conversation-list-item text-decoration-none text-reset">
      <div class="d-flex justify-content-between">
        <div class="fw-semibold">{{ n.title }}</div>
        <div class="small text-muted-navy">{{ n.created_at.strftime('%d %b, %H:%M') }}</div>
      </div>
      {% if n.body %}<div class="small text-muted-navy">{{ n.body }}</div>{% endif %}
    </a>
    {% else %}
    <div class="empty-state"><div class="empty-icon"><i class="bi bi-bell-slash" aria-hidden="true"></i></div><p>You're all caught up!</p></div>
    {% endfor %}
  </div>
</div>
{% endblock %}
